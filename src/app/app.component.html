<div class="tw-flex tw-flex-col tw-h-screen tw-bg-background tw-text-foreground">
  <header
    class="tw-flex tw-items-center tw-justify-between tw-px-6 tw-py-3 tw-border-b tw-border-border tw-bg-card"
  >
    <div class="tw-flex tw-items-center tw-gap-6">
      <!-- Brand -->
      <a [routerLink]="['/']" class="tw-flex tw-items-center tw-gap-2 tw-text-foreground hover:tw-opacity-80 tw-transition">
        <span class="material-symbols tw-text-2xl tw-text-primary" aria-hidden="true">phishing</span>
        <span class="tw-text-xl tw-font-bold">River King Engine</span>
      </a>

      <!-- Project navigation (visible only when inside a project) -->
      @if (isProjectRoute()) {
        <nav class="tw-flex tw-items-center tw-gap-1 tw-border-l tw-border-border tw-pl-6">
          <a
            [routerLink]="['/project', projectId(), 'scenes']"
            routerLinkActive="tw-bg-primary/10 tw-text-primary"
            class="tw-flex tw-items-center tw-gap-1.5 tw-px-3 tw-py-1.5 tw-rounded-md tw-text-sm tw-font-medium tw-text-muted-foreground hover:tw-bg-muted tw-transition"
          >
            <span class="material-symbols" aria-hidden="true">map</span>
            Scenes
          </a>
          <a
            [routerLink]="['/project', projectId(), 'tiles']"
            routerLinkActive="tw-bg-primary/10 tw-text-primary"
            class="tw-flex tw-items-center tw-gap-1.5 tw-px-3 tw-py-1.5 tw-rounded-md tw-text-sm tw-font-medium tw-text-muted-foreground hover:tw-bg-muted tw-transition"
          >
            <span class="material-symbols" aria-hidden="true">grid_view</span>
            Tiles
          </a>
          <a
            [routerLink]="['/project', projectId(), 'sprites']"
            routerLinkActive="tw-bg-primary/10 tw-text-primary"
            class="tw-flex tw-items-center tw-gap-1.5 tw-px-3 tw-py-1.5 tw-rounded-md tw-text-sm tw-font-medium tw-text-muted-foreground hover:tw-bg-muted tw-transition"
          >
            <span class="material-symbols" aria-hidden="true">brush</span>
            Sprites
          </a>
        </nav>
      }
    </div>

    <button
      type="button"
      (click)="theme.toggle()"
      class="tw-inline-flex tw-items-center tw-gap-2 tw-px-3 tw-py-2 tw-rounded-md tw-bg-primary tw-text-primary-foreground tw-transition hover:tw-opacity-90"
    >
      <span class="material-symbols" aria-hidden="true">
        @if (theme.theme() === 'dark') {
          light_mode
        } @else {
          dark_mode
        }
      </span>
      <span>{{ theme.theme() === 'dark' ? 'Light' : 'Dark' }}</span>
    </button>
  </header>

  <main class="tw-flex-1 tw-overflow-hidden">
    <router-outlet />
  </main>
</div>

<rk-toast />
