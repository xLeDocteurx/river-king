<div class="tw-flex tw-items-center tw-gap-1 tw-w-full">
  @if (tile().type === 'animated') {
    <button
      type="button"
      class="tw-flex tw-items-center tw-justify-center tw-w-6 tw-h-6 tw-rounded-sm tw-bg-card-bg tw-border tw-border-border tw-text-foreground tw-cursor-pointer hover:tw-bg-muted"
      [title]="playing() ? 'Stop preview' : 'Play preview'"
      (click)="togglePlayback.emit()"
    >
      <span class="material-symbols tw-text-sm" aria-hidden="true">
        {{ playing() ? 'stop' : 'play_arrow' }}
      </span>
    </button>
  }

  <div
    class="tw-flex tw-items-center tw-gap-1 tw-flex-1 tw-overflow-x-auto tw-py-1"
    cdkDropList
    cdkDropListOrientation="horizontal"
    (cdkDropListDropped)="onDropped($event)"
  >
    @for (frame of frames(); track frame.id; let i = $index) {
      <div
        class="tw-relative tw-flex tw-flex-col tw-items-center tw-gap-0.5 tw-p-0.5 tw-rounded-sm tw-border tw-cursor-pointer hover:tw-bg-muted"
        [class.tw-border-accent]="selectedFrameId() === frame.id"
        [class.tw-border-border]="selectedFrameId() !== frame.id"
        cdkDrag
        tabindex="0"
        (click)="frameSelect.emit(frame.id)"
        (keydown.enter)="frameSelect.emit(frame.id)"
        (keydown.space)="frameSelect.emit(frame.id); $event.preventDefault()"
        [title]="frame.name"
      >
        <div
          class="tw-w-8 tw-h-8 tw-bg-[length:100%_100%] tw-bg-center tw-bg-no-repeat tw-rounded-sm"
          [style.background-image]="'url(' + frame.pixelData + ')'"
        ></div>
        <span class="tw-text-[10px] tw-text-muted-foreground">{{ i + 1 }}</span>
        <ng-container *cdkDragPreview>
          <div
            class="tw-w-8 tw-h-8 tw-bg-[length:100%_100%] tw-bg-center tw-bg-no-repeat"
            [style.background-image]="'url(' + frame.pixelData + ')'"
          ></div>
        </ng-container>
        <ng-container *cdkDragPlaceholder>
          <div class="tw-w-8 tw-h-8"></div>
        </ng-container>
      </div>
    }
  </div>

  <div class="tw-flex tw-items-center tw-gap-0.5">
    <button
      type="button"
      class="tw-flex tw-items-center tw-justify-center tw-w-6 tw-h-6 tw-rounded-sm tw-bg-card-bg tw-border tw-border-border tw-text-foreground tw-cursor-pointer hover:tw-bg-muted"
      title="Add frame"
      (click)="addFrame.emit()"
    >
      <span class="material-symbols tw-text-sm" aria-hidden="true">add</span>
    </button>
    @if (selectedFrameId(); as fid) {
      <button
        type="button"
        class="tw-flex tw-items-center tw-justify-center tw-w-6 tw-h-6 tw-rounded-sm tw-bg-card-bg tw-border tw-border-border tw-text-foreground tw-cursor-pointer hover:tw-bg-muted"
        title="Duplicate frame"
        (click)="duplicateFrame.emit(fid)"
      >
        <span class="material-symbols tw-text-sm" aria-hidden="true">content_copy</span>
      </button>
      @if (frames().length > 1) {
        <button
          type="button"
          class="tw-flex tw-items-center tw-justify-center tw-w-6 tw-h-6 tw-rounded-sm tw-bg-card-bg tw-border tw-border-border tw-text-foreground tw-cursor-pointer hover:tw-bg-destructive/10 hover:tw-text-destructive"
          title="Delete frame"
          (click)="deleteFrame.emit(fid)"
        >
          <span class="material-symbols tw-text-sm" aria-hidden="true">delete</span>
        </button>
      }
    }
  </div>
</div>
