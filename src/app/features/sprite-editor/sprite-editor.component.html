<div class="tw-flex tw-h-full">
  <!-- Left: Sprite List -->
  @if (!focusMode()) {
    <div class="tw-w-64 tw-shrink-0 tw-border-r tw-border-border tw-bg-card-bg tw-flex tw-flex-col">
      <div
        class="tw-flex tw-items-center tw-justify-between tw-px-4 tw-py-3 tw-border-b tw-border-border"
      >
        <h3 class="tw-font-semibold tw-text-foreground">Sprites</h3>
        <button
          type="button"
          (click)="createSprite()"
          class="tw-p-1 tw-rounded-md hover:tw-bg-muted"
          title="New Sprite"
        >
          <span class="material-symbols" aria-hidden="true">add</span>
        </button>
      </div>
      <div class="tw-flex-1 tw-overflow-auto tw-p-2 tw-flex tw-flex-col tw-gap-1">
        @for (sprite of sprites(); track sprite.id) {
          <div class="tw-flex tw-items-center tw-gap-1">
            <button
              type="button"
              (click)="selectSprite(sprite.id)"
              [class.tw-bg-primary/10]="selectedSpriteId() === sprite.id"
              class="tw-flex-1 tw-text-left tw-px-3 tw-py-2 tw-rounded-md tw-text-sm tw-text-foreground hover:tw-bg-muted tw-transition tw-flex tw-items-center tw-gap-2"
            >
              <span class="material-symbols tw-text-muted-foreground" aria-hidden="true"
                >image</span
              >
              <span>{{ sprite.name }}</span>
            </button>
            <button
              type="button"
              (click)="requestDelete(sprite.id); $event.stopPropagation()"
              class="tw-p-1 tw-rounded-md tw-text-destructive hover:tw-bg-destructive/10"
              title="Delete"
            >
              <span class="material-symbols tw-text-sm" aria-hidden="true">delete</span>
            </button>
          </div>
        } @empty {
          <div class="tw-text-muted-foreground tw-text-sm tw-text-center tw-py-4">
            No sprites yet
          </div>
        }
      </div>
    </div>
  }

  <!-- Center: Canvas -->
  <div
    class="tw-flex-1 tw-flex tw-flex-col tw-items-center tw-justify-center tw-bg-background tw-p-4 tw-gap-4"
  >
    @if (focusMode()) {
      <div class="tw-flex tw-items-center tw-gap-2 tw-w-full">
        <button
          type="button"
          (click)="backToTiles()"
          class="tw-flex tw-items-center tw-gap-1 tw-px-3 tw-py-1.5 tw-rounded-md hover:tw-bg-muted"
        >
          <span class="material-symbols" aria-hidden="true">arrow_back</span>
          Back to tiles
        </button>
        <h2 class="tw-font-semibold tw-text-foreground">{{ selectedSprite()?.name }}</h2>
      </div>
    }
    @if (selectedSprite() && paletteIndices(); as indices) {
      <rk-pixel-canvas
        [paletteIndices]="indices"
        [palette]="projectPalette()"
        [selectedColorIndex]="selectedColorIndex()"
        [tool]="selectedTool()"
        (indicesChange)="onCanvasChange($event)"
      />
    } @else {
      <div class="tw-text-muted-foreground tw-text-center tw-py-20">Select a sprite to edit</div>
    }
  </div>

  <!-- Right: Tools -->
  @if (!focusMode()) {
    <div
      class="tw-w-56 tw-shrink-0 tw-border-l tw-border-border tw-bg-card-bg tw-p-4 tw-flex tw-flex-col tw-gap-4"
    >
      <rk-palette-manager
        [palette]="projectPalette()"
        [selectedIndex]="selectedPaletteIndex()"
        (selectedIndexChange)="selectedPaletteIndex.set($event)"
      />
      <rk-drawing-tools [tool]="selectedTool()" (toolChange)="selectedTool.set($event)" />
    </div>
  }
</div>

<rk-confirm-dialog
  #confirmDialog
  [data]="deleteDialogData"
  (confirmed)="deleteSprite(spriteToDelete()!)"
  (cancelled)="spriteToDelete.set(null)"
/>
