<div class="tw-flex tw-h-full">
  <div
    [class.tw-hidden]="!leftPanelOpen()"
    class="md:tw-block tw-w-56 tw-shrink-0 tw-bg-card-bg tw-border-r tw-border-border"
  >
    <rk-tile-list-tree
      [tiles]="tiles()"
      [folders]="folders()"
      [selectedTileId]="selectedTileId()"
      [collapsedFolders]="collapsedFolders()"
      (tileSelect)="selectTile($event)"
      (tileCreate)="createTile()"
      (tileDelete)="requestDelete($event)"
      (createFolder)="onCreateFolder($event)"
      (folderDelete)="onFolderDeleteRequest($event)"
      (folderMove)="onFolderMove($event)"
      (folderRename)="onFolderRename($event)"
      (folderChange)="onTileFolderChange($event)"
      (toggleFolder)="toggleFolder($event)"
    />
  </div>
  <button
    type="button"
    (click)="leftPanelOpen.update((v) => !v)"
    [attr.aria-label]="leftPanelOpen() ? 'Hide tile list' : 'Show tile list'"
    title="Toggle tile list"
    class="md:tw-hidden tw-inline-flex tw-items-center tw-justify-center tw-w-8 tw-shrink-0 tw-bg-card-bg tw-text-muted-foreground hover:tw-text-foreground hover:tw-bg-muted tw-transition tw-cursor-pointer"
  >
    <span class="material-symbols" aria-hidden="true">chevron_left</span>
  </button>
  <div class="tw-flex-1 tw-p-4 tw-overflow-auto">
    @if (selectedTile()) {
      <rk-tile-properties
        [tile]="selectedTile()!"
        [projectTileSize]="tileSize()"
        [projectPalette]="palette()"
        (save)="saveTile($event)"
      />
    } @else {
      <div
        class="tw-h-full tw-flex tw-flex-col tw-items-center tw-justify-center tw-text-muted-foreground"
      >
        <span class="material-symbols tw-text-5xl tw-mb-3" aria-hidden="true">grid_view</span>
        <p class="tw-text-sm tw-font-semibold">No tile selected</p>
        <p class="tw-text-xs">Select a tile from the list to edit its properties</p>
      </div>
    }
  </div>
</div>

<rk-confirm-dialog
  #confirmDialog
  [data]="deleteDialogData"
  (confirmed)="deleteTile(tileToDelete()!)"
  (cancelled)="tileToDelete.set(null)"
/>

<rk-confirm-dialog
  #folderDeleteDialog
  [data]="folderDeleteDialogData()"
  (confirmed)="onConfirmFolderDelete()"
  (cancelled)="pendingDeleteFolderPath.set(null)"
/>
