<div class="tw-flex tw-flex-col tw-h-full tw-bg-card-bg tw-border-r tw-border-border">
  <div
    class="tw-flex tw-items-center tw-justify-between tw-px-4 tw-py-3 tw-border-b tw-border-border"
  >
    <h3 class="tw-font-semibold tw-text-foreground">Tiles</h3>
    <button
      type="button"
      (click)="tileCreate.emit()"
      class="tw-p-1 tw-rounded-sm hover:tw-bg-muted"
      title="New Tile"
    >
      <span class="material-symbols" aria-hidden="true">add</span>
    </button>
  </div>
  <div class="tw-flex-1 tw-overflow-auto tw-p-2">
    @for (tile of tiles(); track tile.id) {
      <button
        type="button"
        (click)="tileSelect.emit(tile.id)"
        [class.tw-bg-primary/10]="selectedTileId() === tile.id"
        class="tw-w-full tw-text-left tw-px-3 tw-py-2 tw-rounded-sm tw-text-sm tw-text-foreground hover:tw-bg-muted tw-transition tw-flex tw-items-center tw-gap-2"
      >
        <span class="material-symbols tw-text-muted-foreground" aria-hidden="true">grid_view</span>
        <span>{{ tile.name }}</span>
      </button>
    } @empty {
      <div class="tw-text-muted-foreground tw-text-sm tw-text-center tw-py-4">No tiles yet</div>
    }
  </div>
</div>
