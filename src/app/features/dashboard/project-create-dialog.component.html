<rk-dialog #dialog>
  <div class="tw-p-6">
    <h2 class="tw-text-xl tw-font-bold tw-mb-4">New Project</h2>
    <form (submit)="createProject($event)" class="tw-flex tw-flex-col tw-gap-4">
      <label class="tw-flex tw-flex-col tw-gap-1">
        <span class="tw-text-sm tw-font-medium">Name</span>
        <input
          type="text"
          [value]="projectName()"
          (input)="projectName.set($any($event.target).value)"
          placeholder="My Awesome Game"
          class="tw-px-3 tw-py-2 tw-rounded-sm tw-border tw-border-input tw-bg-background tw-text-foreground"
          required
        />
      </label>
      <fieldset class="tw-flex tw-flex-col tw-gap-1">
        <legend class="tw-text-sm tw-font-medium tw-mb-1">Palette</legend>
        @for (p of palettes; track p.id) {
          <button
            type="button"
            role="radio"
            [aria-checked]="selectedPaletteId() === p.id"
            (click)="selectPalette(p.id)"
            class="tw-flex tw-items-center tw-justify-between tw-gap-3 tw-border-l-2 tw-border-transparent tw-px-3 tw-py-2 tw-rounded-sm tw-text-left hover:tw-bg-muted"
            [class.tw-bg-muted]="selectedPaletteId() === p.id"
            [class.tw-border-accent]="selectedPaletteId() === p.id"
          >
            <span class="tw-text-sm tw-whitespace-nowrap">
              {{ p.name }}
              @if (p.id === 'sweetie-16') {
                <span class="tw-text-muted-foreground">(default)</span>
              }
            </span>
            <span class="tw-flex tw-gap-px tw-overflow-hidden" aria-hidden="true">
              @for (color of p.colors; track $index) {
                <span class="tw-w-1.5 tw-h-4" [style.background-color]="'#' + color"></span>
              }
            </span>
          </button>
        }
      </fieldset>
      <div class="tw-flex tw-justify-end tw-gap-2">
        <button
          type="button"
          (click)="cancel()"
          class="tw-px-4 tw-py-2 tw-rounded-sm tw-border tw-border-border tw-bg-background tw-text-foreground hover:tw-bg-muted"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="tw-px-4 tw-py-2 tw-rounded-sm tw-bg-primary tw-text-primary-foreground hover:tw-opacity-90"
        >
          Create
        </button>
      </div>
    </form>
  </div>
</rk-dialog>
