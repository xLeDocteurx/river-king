<div class="tw-flex tw-flex-col tw-h-full tw-select-none">
  <div class="tw-flex tw-items-center tw-justify-between tw-px-2 tw-py-1 tw-bg-card-bg tw-border-b tw-border-border">
    <button
      class="tw-text-xs tw-font-semibold tw-uppercase tw-tracking-wider tw-text-muted-foreground tw-cursor-pointer hover:tw-text-foreground"
      (click)="toggleCollapsed.emit()"
    >
      Layers
    </button>
    <button
      class="tw-w-5 tw-h-5 tw-flex tw-items-center tw-justify-center tw-rounded-sm tw-bg-card-bg tw-border tw-border-border tw-text-foreground tw-cursor-pointer hover:tw-bg-accent"
      title="Add layer"
      (click)="addLayer.emit('Layer ' + (layers().length + 1))"
    >
      <span class="material-symbols tw-text-[14px]" aria-hidden="true">add</span>
    </button>
  </div>
  @if (!collapsed()) {
    <div class="tw-flex-1 tw-overflow-y-auto">
      @for (layer of displayLayers(); track layer.id; let i = $index; let last = $last) {
        <div
          class="tw-group tw-flex tw-flex-col tw-gap-1 tw-px-2 tw-py-1.5 tw-cursor-pointer hover:tw-bg-accent/50"
          [class.tw-bg-accent]="layer.id === activeLayerId()"
          (click)="layerSelect.emit(layer.id)"
          (dblclick)="startRename(layer)"
          tabindex="0"
          (keydown.enter)="layerSelect.emit(layer.id)"
          (keydown.space)="layerSelect.emit(layer.id)"
        >
          <div class="tw-flex tw-items-center tw-gap-1.5">
            <button
              class="tw-w-4 tw-h-4 tw-flex tw-items-center tw-justify-center tw-rounded-sm tw-text-muted-foreground tw-cursor-pointer hover:tw-text-foreground"
              [title]="layer.visible ? 'Hide layer' : 'Show layer'"
              (click)="toggleVisibility.emit(layer.id); $event.stopPropagation()"
            >
              <span class="material-symbols tw-text-[14px]" aria-hidden="true">
                {{ layer.visible ? 'visibility' : 'visibility_off' }}
              </span>
            </button>
            @if (renamingLayerId() === layer.id) {
              <input
                class="tw-flex-1 tw-min-w-0 tw-px-1 tw-py-0 tw-text-xs tw-bg-background tw-text-foreground tw-border tw-border-border tw-rounded-sm tw-outline-none"
                [value]="renameValue()"
                (input)="renameValue.set($any($event.target).value)"
                (keydown.enter)="commitRename()"
                (keydown.escape)="cancelRename()"
                (blur)="commitRename()"
                (click)="$event.stopPropagation()"
              />
            } @else {
              <span class="tw-flex-1 tw-min-w-0 tw-text-xs tw-truncate" [class.tw-text-muted-foreground]="!layer.visible">
                {{ layer.name }}
              </span>
            }
            <div class="tw-flex tw-items-center tw-opacity-0 group-hover:tw-opacity-100">
              <button
                class="tw-w-4 tw-h-4 tw-flex tw-items-center tw-justify-center tw-text-muted-foreground tw-cursor-pointer hover:tw-text-foreground"
                title="Move up"
                [disabled]="i === 0"
                (click)="reorder.emit({ layerId: layer.id, direction: 'up' }); $event.stopPropagation()"
              >
                <span class="material-symbols tw-text-[12px]" aria-hidden="true">arrow_upward</span>
              </button>
              <button
                class="tw-w-4 tw-h-4 tw-flex tw-items-center tw-justify-center tw-text-muted-foreground tw-cursor-pointer hover:tw-text-foreground"
                title="Move down"
                [disabled]="last"
                (click)="reorder.emit({ layerId: layer.id, direction: 'down' }); $event.stopPropagation()"
              >
                <span class="material-symbols tw-text-[12px]" aria-hidden="true">arrow_downward</span>
              </button>
              <button
                class="tw-w-4 tw-h-4 tw-flex tw-items-center tw-justify-center tw-text-destructive tw-cursor-pointer hover:tw-text-destructive/80"
                title="Delete layer"
                [disabled]="layers().length <= 1"
                (click)="deleteLayer.emit(layer.id); $event.stopPropagation()"
              >
                <span class="material-symbols tw-text-[12px]" aria-hidden="true">delete</span>
              </button>
            </div>
          </div>
          @if (layer.id === activeLayerId()) {
            <div class="tw-flex tw-items-center tw-gap-1.5 tw-ml-5">
              <span class="tw-text-[10px] tw-text-muted-foreground tw-shrink-0">Op</span>
              <input
                type="range"
                min="0"
                max="1"
                step="0.05"
                class="tw-flex-1 tw-h-1 tw-accent-primary tw-cursor-pointer"
                [value]="layer.opacity"
                (input)="opacityChange.emit({ layerId: layer.id, opacity: +$any($event.target).value })"
                (click)="$event.stopPropagation()"
              />
              <span class="tw-text-[10px] tw-text-muted-foreground tw-w-7 tw-text-right">{{ (layer.opacity * 100) | number:'1.0-0' }}%</span>
            </div>
          }
        </div>
      }
    </div>
  }
</div>
