<div class="tw-flex tw-h-full">
  <rk-scene-list
    class="tw-w-56 tw-shrink-0 tw-bg-card-bg tw-border-r tw-border-border"
    [scenes]="scenes()"
    [folders]="folders()"
    [selectedSceneId]="selectedSceneId()"
    (sceneSelect)="selectScene($event)"
    (createScene)="onCreateScene()"
    (sceneDelete)="onDeleteSceneRequest($event)"
    (createFolder)="onCreateFolder($event)"
    (sceneFolderChange)="onSceneFolderChange($event)"
    (folderRename)="onFolderRename($event)"
  />
  <div class="tw-flex-1 tw-relative tw-overflow-hidden tw-bg-background">
    <rk-map-canvas
      [scene]="selectedScene()"
      [layers]="sceneLayers()"
      [activeLayerId]="activeLayerId()"
      [selectedTileId]="selectedTileId()"
      [palette]="projectPalette()"
      [tileImages]="tileImages()"
      [tileSize]="projectTileSize()"
      [tileFootprints]="tileFootprints()"
      [tileAnimations]="tileAnimations()"
      (tilePlaced)="onTilePlaced($event)"
    />
    <button
      class="tw-absolute tw-top-1 tw-right-1 tw-z-10 tw-flex tw-items-center tw-justify-center tw-w-6 tw-h-6 tw-rounded-sm tw-bg-card-bg tw-border tw-border-border tw-text-foreground tw-cursor-pointer hover:tw-bg-accent"
      [title]="mapCanvasRef()?.showGrid() ? 'Hide grid' : 'Show grid'"
      (click)="mapCanvasRef()?.showGrid.set(!mapCanvasRef()?.showGrid())"
    >
      <span class="material-symbols" aria-hidden="true">grid_on</span>
    </button>
  </div>
  <div class="tw-w-52 tw-shrink-0 tw-bg-card-bg tw-border-l tw-border-border tw-flex tw-flex-col">
    @if (selectedScene(); as scene) {
      <rk-scene-minimap
        [scene]="scene"
        [layers]="sceneLayers()"
        [tileImages]="tileImages()"
        [tileSize]="projectTileSize()"
        [tileFootprints]="tileFootprints()"
        [viewportWidth]="mapCanvasRef()?.viewportWidth() ?? 0"
        [viewportHeight]="mapCanvasRef()?.viewportHeight() ?? 0"
        [cameraX]="mapCanvasRef()?.cameraX() ?? 0"
        [cameraY]="mapCanvasRef()?.cameraY() ?? 0"
        [zoom]="mapCanvasRef()?.zoom() ?? 1"
        (cameraJump)="onMinimapJump($event)"
      />
      <rk-layer-panel
        class="tw-h-40 tw-shrink-0 tw-border-b tw-border-border"
        [layers]="sceneLayers()"
        [activeLayerId]="activeLayerId()"
        (layerSelect)="selectLayer($event)"
        (addLayer)="onAddLayer($event)"
        (deleteLayer)="onDeleteLayer($event)"
        (toggleVisibility)="onToggleLayerVisibility($event)"
        (opacityChange)="onLayerOpacityChange($event)"
        (rename)="onLayerRename($event)"
        (reorder)="onLayerReorder($event)"
      />
    }
    <rk-tile-palette
      class="tw-flex-1 tw-overflow-auto"
      [tiles]="projectTiles()"
      [selectedTileId]="selectedTileId()"
      [palette]="projectPalette()"
      [tileImages]="tileFirstFrames()"
      (tileSelect)="selectedTileId.set($event)"
    />
  </div>
</div>

<rk-confirm-dialog [data]="deleteDialogData()" (confirmed)="onConfirmDelete()" />
