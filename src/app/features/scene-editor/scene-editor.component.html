<div class="tw-flex tw-h-full">
  <div
    [class.tw-hidden]="!leftPanelOpen()"
    class="md:tw-block tw-w-56 tw-shrink-0 tw-bg-card-bg tw-border-r tw-border-border"
  >
    <rk-scene-list
      [scenes]="scenes()"
      [folders]="folders()"
      [collapsedFolders]="collapsedFolders()"
      [selectedSceneId]="selectedSceneId()"
      (sceneSelect)="selectScene($event)"
      (createScene)="onCreateScene()"
      (sceneDelete)="onDeleteSceneRequest($event)"
      (createFolder)="onCreateFolder($event)"
      (folderDelete)="onFolderDeleteRequest($event)"
      (sceneFolderChange)="onSceneFolderChange($event)"
      (folderRename)="onFolderRename($event)"
      (toggleFolder)="onToggleSceneFolder($event)"
    />
  </div>
  <button
    type="button"
    (click)="leftPanelOpen.update((v) => !v)"
    [attr.aria-label]="leftPanelOpen() ? 'Hide scene list' : 'Show scene list'"
    title="Toggle scene list"
    class="md:tw-hidden tw-inline-flex tw-items-center tw-justify-center tw-w-8 tw-shrink-0 tw-bg-card-bg tw-text-muted-foreground hover:tw-text-foreground hover:tw-bg-muted tw-transition tw-cursor-pointer"
  >
    <span class="material-symbols" aria-hidden="true">chevron_left</span>
  </button>
  <div class="tw-flex-1 tw-relative tw-overflow-hidden tw-bg-background">
    <rk-map-canvas
      [scene]="selectedScene()"
      [layers]="sceneLayers()"
      [activeLayerId]="activeLayerId()"
      [selectedTileId]="selectedTileId()"
      [palette]="projectPalette()"
      [tileImages]="tileImages()"
      [tileSize]="projectTileSize()"
      [tileFootprints]="tileFootprints()"
      [tileAnimations]="tileAnimations()"
      [playMode]="playMode()"
      [placeSpawnMode]="placeSpawnMode()"
      [spawnPoint]="selectedScene()?.spawnPoint ?? null"
      (tilePlaced)="onTilePlaced($event)"
      (spawnPlaced)="onSpawnPlaced($event)"
    />
    <div class="tw-absolute tw-top-1 tw-right-1 tw-z-10 tw-flex tw-gap-1">
      <button
        class="tw-inline-flex tw-items-center tw-justify-center tw-w-6 tw-h-6 tw-rounded-sm tw-bg-card-bg tw-border tw-border-border tw-text-foreground tw-cursor-pointer hover:tw-bg-accent"
        [title]="playMode() ? 'Exit play mode' : 'Enter play mode'"
        (click)="playMode() ? exitPlay() : enterPlay()"
      >
        <span class="material-symbols" aria-hidden="true">{{
          playMode() ? 'stop' : 'play_arrow'
        }}</span>
      </button>
      @if (!playMode()) {
        <button
          class="tw-inline-flex tw-items-center tw-justify-center tw-w-6 tw-h-6 tw-rounded-sm tw-bg-card-bg tw-border tw-border-border tw-text-foreground tw-cursor-pointer hover:tw-bg-accent"
          [class.tw-bg-accent]="placeSpawnMode()"
          [title]="placeSpawnMode() ? 'Finish placing spawn' : 'Place spawn point'"
          (click)="toggleSpawnTool()"
        >
          <span class="material-symbols" aria-hidden="true">my_location</span>
        </button>
      }
      <button
        class="tw-inline-flex tw-items-center tw-justify-center tw-w-6 tw-h-6 tw-rounded-sm tw-bg-card-bg tw-border tw-border-border tw-text-foreground tw-cursor-pointer hover:tw-bg-accent"
        [title]="mapCanvasRef()?.showGrid() ? 'Hide grid' : 'Show grid'"
        (click)="mapCanvasRef()?.showGrid.set(!mapCanvasRef()?.showGrid())"
      >
        <span class="material-symbols" aria-hidden="true">grid_on</span>
      </button>
    </div>
  </div>
  <div
    [class.tw-hidden]="!rightPanelOpen()"
    class="md:tw-block tw-w-52 tw-shrink-0 tw-bg-card-bg tw-border-l tw-border-border tw-flex tw-flex-col"
  >
    @if (selectedScene(); as scene) {
      <rk-scene-minimap
        [scene]="scene"
        [layers]="sceneLayers()"
        [tileImages]="tileImages()"
        [tileSize]="projectTileSize()"
        [tileFootprints]="tileFootprints()"
        [viewportWidth]="mapCanvasRef()?.viewportWidth() ?? 0"
        [viewportHeight]="mapCanvasRef()?.viewportHeight() ?? 0"
        [cameraX]="mapCanvasRef()?.cameraX() ?? 0"
        [cameraY]="mapCanvasRef()?.cameraY() ?? 0"
        [zoom]="mapCanvasRef()?.zoom() ?? 1"
        (cameraJump)="onMinimapJump($event)"
      />
      <rk-layer-panel
        class="tw-h-40 tw-shrink-0 tw-border-b tw-border-border"
        [layers]="sceneLayers()"
        [activeLayerId]="activeLayerId()"
        (layerSelect)="selectLayer($event)"
        (addLayer)="onAddLayer($event)"
        (deleteLayer)="onDeleteLayer($event)"
        (toggleVisibility)="onToggleLayerVisibility($event)"
        (opacityChange)="onLayerOpacityChange($event)"
        (rename)="onLayerRename($event)"
        (reorder)="onLayerReorder($event)"
      />
    }
    <rk-tile-palette
      class="tw-flex-1 tw-overflow-auto"
      [tiles]="projectTiles()"
      [selectedTileId]="selectedTileId()"
      [palette]="projectPalette()"
      [tileImages]="tileFirstFrames()"
      (tileSelect)="selectedTileId.set($event)"
    />
  </div>
  <button
    type="button"
    (click)="rightPanelOpen.update((v) => !v)"
    [attr.aria-label]="rightPanelOpen() ? 'Hide inspector panel' : 'Show inspector panel'"
    title="Toggle inspector panel"
    class="md:tw-hidden tw-inline-flex tw-items-center tw-justify-center tw-w-8 tw-shrink-0 tw-bg-card-bg tw-text-muted-foreground hover:tw-text-foreground hover:tw-bg-muted tw-transition tw-cursor-pointer"
  >
    <span class="material-symbols" aria-hidden="true">chevron_right</span>
  </button>
</div>

<rk-confirm-dialog [data]="deleteDialogData()" (confirmed)="onConfirmDelete()" />

<rk-confirm-dialog
  #folderDeleteDialog
  [data]="folderDeleteDialogData()"
  (confirmed)="onConfirmFolderDelete()"
  (cancelled)="pendingDeleteFolderPath.set(null)"
/>
