<div class="tw-flex tw-flex-col tw-h-full tw-bg-card-bg tw-border-r tw-border-border">
  <div
    class="tw-flex tw-items-center tw-justify-between tw-px-3 tw-py-2 tw-border-b tw-border-border"
  >
    <h3 class="tw-text-xs tw-font-semibold tw-uppercase tw-tracking-wider tw-text-muted-foreground">
      {{ title() }}
    </h3>
    <div class="tw-flex tw-gap-1">
      <button
        type="button"
        (click)="createGroup.emit()"
        class="tw-p-1 tw-rounded-sm hover:tw-bg-muted"
        [title]="createGroupLabel()"
      >
        <span class="material-symbols" aria-hidden="true">create_new_folder</span>
      </button>
      <button
        type="button"
        (click)="createItem.emit()"
        class="tw-p-1 tw-rounded-sm hover:tw-bg-muted"
        [title]="createItemLabel()"
      >
        <span class="material-symbols" aria-hidden="true">add</span>
      </button>
    </div>
  </div>
  <div class="tw-flex-1 tw-overflow-auto tw-p-2">
    <div cdkDropListGroup>
      @for (group of groups(); track group.key) {
        <div class="tw-mb-3" [style.padding-left.px]="indentGroups() ? group.depth * 16 : 0">
          <div
            class="tw-w-full tw-flex tw-items-center tw-gap-2 tw-px-2 tw-py-1 tw-rounded-sm tw-text-[11px] tw-font-semibold tw-uppercase tw-tracking-wider tw-text-muted-foreground hover:tw-text-foreground tw-cursor-pointer"
            [class.tw-bg-primary/10]="isGroupDropTarget(group.key)"
            draggable="true"
            (dragstart)="onGroupDragStart(group.key, $event)"
            (dragover)="onGroupDragOver(group.key, $event)"
            (drop)="onGroupDrop(group.key)"
            (dragend)="onGroupDragEnd()"
          >
            <button
              type="button"
              (click)="toggleGroup.emit(group.key)"
              class="tw-flex tw-items-center tw-gap-2 tw-text-left tw-bg-transparent tw-border-0 tw-p-0 tw-text-[11px] tw-font-semibold tw-uppercase tw-tracking-wider tw-text-muted-foreground hover:tw-text-foreground"
            >
              <span
                class="material-symbols tw-text-sm tw-transition-transform"
                [class.-tw-rotate-90]="isCollapsed(group.key)"
                aria-hidden="true"
                >expand_more</span
              >
              <span>{{ group.key || 'Ungrouped' }}</span>
            </button>
          </div>
          @if (!isCollapsed(group.key)) {
            <div
              cdkDropList
              [cdkDropListData]="group.items"
              (cdkDropListDropped)="onDrop($event, group.key)"
              class="tw-flex tw-flex-col tw-gap-1 tw-min-h-[2.5rem] tw-mt-1 tw-rounded-sm"
            >
              @for (item of group.items; track item.id) {
                <div
                  cdkDrag
                  [cdkDragData]="item"
                  class="tw-w-full tw-flex tw-items-center tw-gap-1"
                >
                  <button
                    type="button"
                    (click)="itemSelect.emit(item.id)"
                    [class.tw-bg-primary/10]="selectedItemId() === item.id"
                    class="tw-flex-1 tw-min-w-0 tw-text-left tw-px-2 tw-py-1.5 tw-rounded-sm tw-text-xs tw-text-foreground hover:tw-bg-muted tw-transition-colors tw-flex tw-items-center tw-gap-2"
                  >
                    <span class="material-symbols tw-text-muted-foreground" aria-hidden="true">{{
                      itemIcon()
                    }}</span>
                    <span class="tw-truncate">{{ item.name }}</span>
                  </button>
                  <button
                    type="button"
                    (click)="itemDelete.emit(item.id); $event.stopPropagation()"
                    [title]="'Delete ' + title()"
                    class="tw-p-1 tw-rounded-sm tw-shrink-0 tw-text-muted-foreground hover:tw-text-destructive hover:tw-bg-muted tw-transition-colors"
                  >
                    <span class="material-symbols tw-text-sm" aria-hidden="true">delete</span>
                  </button>
                </div>
              } @empty {
                <div
                  class="tw-h-[2rem] tw-flex tw-items-center tw-justify-center tw-rounded-sm tw-border tw-border-dashed tw-border-border tw-text-xs tw-text-muted-foreground"
                >
                  Drop {{ title().toLowerCase() }} here
                </div>
              }
            </div>
          }
        </div>
      } @empty {
        <div class="tw-text-muted-foreground tw-text-sm tw-text-center tw-py-4">
          No {{ title().toLowerCase() }} yet
        </div>
      }
    </div>
  </div>
</div>
